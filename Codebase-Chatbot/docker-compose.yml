# version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: codebase-chatbot-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB_NAME:-postgres}
      POSTGRES_USER: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abc@123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Main server
      dockerfile: Dockerfile
    container_name: codebase-chatbot-backend
    environment:
      NODE_ENV: production
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      POSTGRES_DB_NAME: ${POSTGRES_DB_NAME:-postgres}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abc@123}
      POSTGRES_HOST: postgres
      FRONTEND_URL: http://localhost:3000
      WEAVIATE_URL: ${WEAVIATE_URL:?Set WEAVIATE_URL in .env}
      WEAVIATE_API_KEY: ${WEAVIATE_API_KEY:?Set WEAVIATE_API_KEY in .env}
      JINA_API_KEY: ${JINA_API_KEY:?Set JINA_API_KEY in .env}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env}
      UPSTASH_HOST: ${UPSTASH_HOST:-living-lizard-199962.upstash.io}
      UPSTASH_PORT: ${UPSTASH_PORT:-6379}
      UPSTASH_PASSWORD: ${UPSTASH_PASSWORD:?Set UPSTASH_PASSWORD in .env}
      RERANKER_URL: ${RERANKER_URL:-http://reranker:8000}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./Main server:/app
      - /app/node_modules
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api
        VITE_BACKEND_URL: http://localhost:5000
    container_name: codebase-chatbot-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  private:
    build:
      context: ./Private server
      dockerfile: Dockerfile
    container_name: codebase-chatbot-private
    environment:
      NODE_ENV: production
      WEAVIATE_URL: ${WEAVIATE_URL:?Set WEAVIATE_URL in .env}
      WEAVIATE_API_KEY: ${WEAVIATE_API_KEY:?Set WEAVIATE_API_KEY in .env}
      JINA_API_KEY: ${JINA_API_KEY:?Set JINA_API_KEY in .env}
      UPSTASH_HOST: ${UPSTASH_HOST:-living-lizard-199962.upstash.io}
      UPSTASH_PORT: ${UPSTASH_PORT:-6379}
      UPSTASH_PASSWORD: ${UPSTASH_PASSWORD:?Set UPSTASH_PASSWORD in .env}
    depends_on:
      - backend
    volumes:
      - ./Private server:/app
      - /app/node_modules
    restart: unless-stopped

  reranker:
    build:
      context: ./Reranker
      dockerfile: Dockerfile
      args:
        RERANKER_MODEL: ${RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
    container_name: codebase-chatbot-reranker
    environment:
      RERANKER_MODEL: ${RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
    ports:
      - "${RERANKER_HOST_PORT:-8001}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:

